name: build-android

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
      - Erick
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tests.yml

  build:
    needs: ci
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.ci.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    env:
      ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/proyecto-finanzas.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: ${{ github.run_number }}.0
      VITE_API_BASE_URL: https://proyectofinanzas-oqqh.onrender.com/api

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: movil/package-lock.json

      - name: Validar secretos de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Faltan secretos de firma de Android en GitHub Actions." >&2
            exit 1
          fi

      - name: Decodificar keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          keytool -list -keystore "$ANDROID_KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

      - name: Instalar dependencias móviles
        working-directory: movil
        run: npm ci

      - name: Compilar web móvil
        working-directory: movil
        run: npm run build

      - name: Sincronizar Capacitor
        working-directory: movil
        run: npm run cap:sync

      - name: Compilar APK firmado
        working-directory: movil/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Preparar APK
        run: |
          shopt -s nullglob
          apks=(movil/android/app/build/outputs/apk/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No se generó ningún APK release." >&2
            exit 1
          fi
          cp "${apks[0]}" "$RUNNER_TEMP/proyecto-finanzas.apk"
          echo "APK_PATH=$RUNNER_TEMP/proyecto-finanzas.apk" >> "$GITHUB_ENV"

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: proyecto-finanzas-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-${{ github.run_id }}-${{ github.run_attempt }}"
          TARGET="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          gh release create "$TAG" "$APK_PATH" --target "$TARGET" --title "Android $TAG" --generate-notes
