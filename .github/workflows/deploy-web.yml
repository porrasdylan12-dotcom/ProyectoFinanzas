name: deploy-web

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
    branches:
      - main
      - Erick
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: ci
    if: >-
      always() &&
      (
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && needs.ci.result == 'success')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Validar secretos
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Faltan los secretos CLOUDFLARE_ACCOUNT_ID o CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi

      - name: Generar web estática
        working-directory: web
        run: npm run build:web
        env:
          VITE_API_URL: https://proyectofinanzas-oqqh.onrender.com/api

      - name: Desplegar web en Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web

      - name: Verificar web estática
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$DEPLOYMENT_URL" ]; then
            echo "Wrangler no devolvió deployment-url." >&2
            exit 1
          fi
          curl --fail --silent --show-error "$DEPLOYMENT_URL" >/dev/null
