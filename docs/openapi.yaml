openapi: 3.0.3
info:
  title: API ProyectoFinanzas
  description: |
    API REST de finanzas personales y gastos compartidos. Permite administrar
    cuentas, categorías, presupuestos, transacciones, grupos, gastos
    compartidos y deudas resultantes. Todos los recursos protegidos requieren
    un token Bearer de Sanctum (obtenible en `/api/sanctum/token`).
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Servidor local

tags:
  - name: Autenticación
  - name: Cuentas
  - name: Categorías
  - name: Presupuestos
  - name: Transacciones
  - name: Grupos
  - name: Gastos compartidos
  - name: Deudas

security:
  - bearerAuth: []

paths:
  /sanctum/token:
    post:
      tags: [Autenticación]
      summary: Obtener token de acceso
      description: Emite un token Sanctum (30 minutos de vigencia) para el usuario.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, device_name]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, example: "Postman" }
      responses:
        '200':
          description: Token generado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, example: "1|abcdef123456" }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /user:
    get:
      tags: [Autenticación]
      summary: Usuario autenticado
      responses:
        '200':
          description: Datos del usuario autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/NoAutenticado'

  /accounts:
    get:
      tags: [Cuentas]
      summary: Listar cuentas
      description: Lista paginada de cuentas del usuario autenticado.
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: name
          in: query
          schema: { type: string }
          description: Filtrar por nombre (búsqueda parcial).
        - name: type
          in: query
          schema: { type: string, enum: [ahorros, corriente, efectivo] }
          description: Filtrar por tipo de cuenta.
      responses:
        '200':
          description: Lista paginada de cuentas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Cuenta' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Cuentas]
      summary: Crear cuenta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CuentaRequest' }
      responses:
        '201':
          description: Cuenta creada.
          headers:
            Location:
              schema: { type: string }
              description: URL del recurso creado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuenta' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /accounts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Cuentas]
      summary: Mostrar cuenta
      responses:
        '200':
          description: Detalle de la cuenta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuenta' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Cuentas]
      summary: Actualizar cuenta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CuentaRequest' }
      responses:
        '200':
          description: Cuenta actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Cuenta' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    delete:
      tags: [Cuentas]
      summary: Eliminar cuenta
      description: No permite eliminar cuentas que poseen transacciones.
      responses:
        '204':
          description: Cuenta eliminada correctamente.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /accounts/{id}/transactions:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Transacciones]
      summary: Listar transacciones de una cuenta
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Transacciones de la cuenta.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Transaccion' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    post:
      tags: [Transacciones]
      summary: Crear transacción en una cuenta
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransaccionRequest' }
      responses:
        '201':
          description: Transacción creada.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaccion' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /categories:
    get:
      tags: [Categorías]
      summary: Listar categorías
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: name
          in: query
          schema: { type: string }
        - name: type
          in: query
          schema: { type: string, enum: [ingreso, gasto] }
      responses:
        '200':
          description: Lista paginada de categorías.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Categoria' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Categorías]
      summary: Crear categoría
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaRequest' }
      responses:
        '201':
          description: Categoría creada.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /categories/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Categorías]
      summary: Mostrar categoría
      responses:
        '200':
          description: Detalle de la categoría.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Categorías]
      summary: Actualizar categoría
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoriaRequest' }
      responses:
        '200':
          description: Categoría actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Categoria' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    delete:
      tags: [Categorías]
      summary: Eliminar categoría
      description: No permite eliminar categorías con transacciones asociadas.
      responses:
        '204':
          description: Categoría eliminada.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

  /budgets:
    get:
      tags: [Presupuestos]
      summary: Listar presupuestos
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: category_id
          in: query
          schema: { type: integer }
        - name: month
          in: query
          schema: { type: integer, minimum: 1, maximum: 12 }
        - name: year
          in: query
          schema: { type: integer, minimum: 2020, maximum: 2100 }
        - name: name
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista paginada de presupuestos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Presupuesto' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Presupuestos]
      summary: Crear presupuesto
      description: No se aceptan presupuestos retroactivos. Montos > 500.000 reciben un descuento del 10 %.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresupuestoRequest' }
      responses:
        '201':
          description: Presupuesto creado.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Presupuesto' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /budgets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Presupuestos]
      summary: Mostrar presupuesto
      responses:
        '200':
          description: Detalle del presupuesto.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Presupuesto' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Presupuestos]
      summary: Actualizar presupuesto
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresupuestoRequest' }
      responses:
        '200':
          description: Presupuesto actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Presupuesto' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    delete:
      tags: [Presupuestos]
      summary: Eliminar presupuesto
      responses:
        '204':
          description: Presupuesto eliminado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /transactions:
    get:
      tags: [Transacciones]
      summary: Listar transacciones
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: account_id
          in: query
          schema: { type: integer }
        - name: category_id
          in: query
          schema: { type: integer }
        - name: type
          in: query
          schema: { type: string, enum: [ingreso, gasto] }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: description
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista paginada de transacciones.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Transaccion' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Transacciones]
      summary: Crear transacción
      description: Recalcula el saldo de la cuenta automáticamente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransaccionRequest' }
      responses:
        '201':
          description: Transacción creada.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaccion' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Transacciones]
      summary: Mostrar transacción
      responses:
        '200':
          description: Detalle de la transacción.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaccion' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Transacciones]
      summary: Actualizar transacción
      responses:
        '200':
          description: Transacción actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaccion' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    delete:
      tags: [Transacciones]
      summary: Eliminar transacción
      responses:
        '204':
          description: Transacción eliminada y saldo recalculado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /groups:
    get:
      tags: [Grupos]
      summary: Listar grupos del usuario
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: name
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista paginada de grupos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Grupo' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Grupos]
      summary: Crear grupo
      description: El creador se agrega automáticamente como administrador.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoRequest' }
      responses:
        '201':
          description: Grupo creado.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grupo' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /groups/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Grupos]
      summary: Mostrar grupo
      responses:
        '200':
          description: Detalle del grupo con sus miembros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grupo' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Grupos]
      summary: Actualizar grupo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrupoRequest' }
      responses:
        '200':
          description: Grupo actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grupo' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    delete:
      tags: [Grupos]
      summary: Eliminar grupo
      description: Solo el administrador del grupo puede eliminarlo.
      responses:
        '204':
          description: Grupo eliminado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/AccesoDenegado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /groups/{id}/shared-expenses:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Gastos compartidos]
      summary: Listar gastos compartidos de un grupo
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Gastos compartidos del grupo.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/GastoCompartido' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    post:
      tags: [Gastos compartidos]
      summary: Crear gasto compartido en un grupo
      description: Genera automáticamente las deudas de los participantes hacia quien pagó.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GastoCompartidoRequest' }
      responses:
        '201':
          description: Gasto compartido creado con sus deudas.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GastoCompartido' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /shared-expenses:
    get:
      tags: [Gastos compartidos]
      summary: Listar gastos compartidos
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Lista paginada de gastos compartidos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/GastoCompartido' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Gastos compartidos]
      summary: Crear gasto compartido
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GastoCompartidoRequest' }
      responses:
        '201':
          description: Gasto compartido creado.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GastoCompartido' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /shared-expenses/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Gastos compartidos]
      summary: Mostrar gasto compartido
      responses:
        '200':
          description: Detalle del gasto compartido con sus deudas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GastoCompartido' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Gastos compartidos]
      summary: Actualizar gasto compartido
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GastoCompartidoRequest' }
      responses:
        '200':
          description: Gasto compartido actualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GastoCompartido' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    delete:
      tags: [Gastos compartidos]
      summary: Eliminar gasto compartido
      responses:
        '204':
          description: Gasto compartido eliminado.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'

  /shared-expenses/{id}/group-debts:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deudas]
      summary: Listar deudas de un gasto compartido
      parameters:
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Deudas del gasto compartido.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Deuda' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    post:
      tags: [Deudas]
      summary: Crear deuda para un gasto compartido
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeudaRequest' }
      responses:
        '201':
          description: Deuda creada.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deuda' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /group-debts:
    get:
      tags: [Deudas]
      summary: Listar deudas del usuario
      description: Devuelve las deudas donde el usuario es deudor o acreedor.
      parameters:
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortDir'
        - name: status
          in: query
          schema: { type: string, enum: [pending, paid] }
      responses:
        '200':
          description: Lista paginada de deudas.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginacion'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Deuda' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
    post:
      tags: [Deudas]
      summary: Crear deuda
      description: El deudor y el acreedor deben ser distintos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeudaRequest' }
      responses:
        '201':
          description: Deuda creada.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deuda' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '422':
          $ref: '#/components/responses/DatosInvalidos'

  /group-debts/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Deudas]
      summary: Mostrar deuda
      responses:
        '200':
          description: Detalle de la deuda.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deuda' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
    put:
      tags: [Deudas]
      summary: Actualizar deuda
      description: "Transiciones válidas: pending → paid. No se puede revertir una deuda pagada."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeudaRequest' }
      responses:
        '200':
          description: Deuda actualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deuda' }
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/DatosInvalidos'
    delete:
      tags: [Deudas]
      summary: Eliminar deuda
      description: No permite eliminar deudas ya pagadas.
      responses:
        '204':
          description: Deuda eliminada.
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PerPage:
      name: per_page
      in: query
      required: false
      description: Cantidad de registros por página (máximo 50).
      schema: { type: integer, minimum: 1, maximum: 50, default: 15 }
    SortBy:
      name: sort_by
      in: query
      required: false
      description: Campo por el cual ordenar.
      schema: { type: string }
    SortDir:
      name: sort_dir
      in: query
      required: false
      description: Dirección del orden.
      schema: { type: string, enum: [asc, desc], default: asc }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
      description: Identificador del recurso.

  responses:
    NoAutenticado:
      description: No se encontró un token de autenticación válido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: No se encontró un token de autenticación válido.
            code: NO_AUTENTICADO
    AccesoDenegado:
      description: No tiene permisos para realizar la acción.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: No tienes permisos para realizar esta acción.
            code: ACCESO_DENEGADO
    NoEncontrado:
      description: El recurso solicitado no existe.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: El recurso solicitado no existe.
            code: RECURSO_NO_ENCONTRADO
    Conflicto:
      description: La petición entra en conflicto con una regla de negocio.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: No se puede eliminar la cuenta porque tiene transacciones asociadas.
            code: CUENTA_CON_DEPENDENCIAS
    DatosInvalidos:
      description: Los datos enviados no son válidos.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  errors:
                    type: object
                    additionalProperties:
                      type: array
                      items: { type: string }
          example:
            message: Los datos enviados no son válidos.
            code: DATOS_INVALIDOS
            errors:
              name: ["Ya existe una cuenta con este nombre para el usuario seleccionado."]

  schemas:
    Error:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string }

    Paginacion:
      type: object
      properties:
        links:
          type: object
          properties:
            first: { type: string }
            last: { type: string }
            prev: { type: [string, "null"] }
            next: { type: [string, "null"] }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            last_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            from: { type: [integer, "null"] }
            to: { type: [integer, "null"] }
            path: { type: string }

    Usuario:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        email: { type: string, format: email }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Cuenta:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        nombre: { type: string }
        saldo: { type: number, format: float }
        tipo: { type: string, enum: [ahorros, corriente, efectivo] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CuentaRequest:
      type: object
      required: [name, type, balance]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 50
          example: "Cuenta principal"
        type:
          type: string
          enum: [ahorros, corriente, efectivo]
          example: ahorros
        balance:
          type: number
          format: float
          minimum: 0
          example: 15000.50

    Categoria:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        nombre: { type: string }
        tipo: { type: string, enum: [ingreso, gasto] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CategoriaRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          maxLength: 50
          example: "Alimentación"
        type:
          type: string
          enum: [ingreso, gasto]
          example: gasto

    Presupuesto:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        categoria_id: { type: integer }
        nombre: { type: string }
        monto_maximo: { type: number, format: float }
        mes: { type: integer, minimum: 1, maximum: 12 }
        anio: { type: integer, minimum: 2020, maximum: 2100 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PresupuestoRequest:
      type: object
      required: [category_id, name, maxAmount, month, year]
      properties:
        category_id: { type: integer, example: 1 }
        name:
          type: string
          minLength: 3
          maxLength: 100
          example: "Presupuesto del mes"
        maxAmount:
          type: number
          format: float
          minimum: 0.01
          example: 250000
        month: { type: integer, minimum: 1, maximum: 12, example: 9 }
        year: { type: integer, minimum: 2020, maximum: 2100, example: 2026 }

    Transaccion:
      type: object
      properties:
        id: { type: integer }
        cuenta_id: { type: integer }
        categoria_id: { type: integer }
        tipo: { type: string, enum: [ingreso, gasto] }
        monto: { type: number, format: float }
        descripcion: { type: [string, "null"] }
        fecha: { type: string, format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TransaccionRequest:
      type: object
      required: [account_id, category_id, type, amount, transaction_date]
      properties:
        account_id: { type: integer, example: 1 }
        category_id: { type: integer, example: 1 }
        type: { type: string, enum: [ingreso, gasto], example: gasto }
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 5000
        description:
          type: string
          maxLength: 1000
          example: "Compra en el supermercado"
        transaction_date: { type: string, format: date, example: "2026-09-10" }

    Grupo:
      type: object
      properties:
        id: { type: integer }
        nombre: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        miembros:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              nombre: { type: string }
              email: { type: string }
              rol: { type: string, enum: [admin, member] }
              fecha_ingreso: { type: string, format: date-time }

    GrupoRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: "Apartamento 301"

    GastoCompartido:
      type: object
      properties:
        id: { type: integer }
        grupo_id: { type: integer }
        usuario_id: { type: integer }
        monto: { type: number, format: float }
        descripcion: { type: [string, "null"] }
        fecha: { type: string, format: date }
        participantes:
          type: array
          items: { type: integer }
        deudas:
          type: array
          items: { $ref: '#/components/schemas/Deuda' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    GastoCompartidoRequest:
      type: object
      required: [group_id, amount, date, participants]
      properties:
        group_id: { type: integer, example: 1 }
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 30000
        description:
          type: string
          maxLength: 1000
          example: "Cena de grupo"
        date: { type: string, format: date, example: "2026-09-10" }
        participants:
          type: array
          minItems: 2
          items: { type: integer }
          example: [2, 3]

    Deuda:
      type: object
      properties:
        id: { type: integer }
        gasto_compartido_id: { type: integer }
        deudor_id: { type: integer }
        acreedor_id: { type: integer }
        nombre: { type: [string, "null"] }
        descripcion: { type: [string, "null"] }
        monto_total: { type: number, format: float }
        estado: { type: string, enum: [pending, paid] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    DeudaRequest:
      type: object
      required: [shared_expense_id, debtor_id, creditor_id, total_amount]
      properties:
        shared_expense_id: { type: integer, example: 1 }
        debtor_id: { type: integer, example: 2 }
        creditor_id: { type: integer, example: 1 }
        name: { type: string, maxLength: 255 }
        description: { type: string }
        total_amount:
          type: number
          format: float
          minimum: 0.01
          example: 15000
        status:
          type: string
          enum: [pending, paid]
          default: pending