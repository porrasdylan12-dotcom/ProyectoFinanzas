<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Incorporación de una persona a un grupo de gastos compartidos mediante su correo electrónico."
        />
        <title>Añadir usuario · finanzas</title>
        <link rel="stylesheet" href="../../css/estilos.css" />
        <link rel="stylesheet" href="../../css/formulario.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header class="barra">
            <div class="barra__marca">
                <a class="barra__logo" href="panel-principal.html">finanzas</a>
            </div>

            <input type="checkbox" id="menu-toggle" class="barra__checkbox" />
            <label for="menu-toggle" class="barra__toggle">Menú</label>

            <nav class="barra__nav" aria-label="Menú principal">
                <ul class="barra__lista">
                    <li>
                        <a class="barra__enlace" href="panel-principal.html"
                            >Inicio</a
                        >
                    </li>
                    <li>
                        <a class="barra__enlace" href="cuentas.html">Cuentas</a>
                    </li>
                    <li>
                        <a
                            class="barra__enlace"
                            href="grupos.html"
                            aria-current="page"
                            >Grupos</a
                        >
                    </li>
                    <li>
                        <a
                            class="barra__enlace"
                            href="panel-principal.html#usuario"
                            >Usuario<span class="barra__usuario"
                                >[Nombre de usuario]</span
                            ></a
                        >
                    </li>
                </ul>
            </nav>
        </header>

        <main class="contenido">
            <div class="cabecera-pagina">
                <h1>Añadir usuario</h1>
                <a class="enlace-accion" href="grupos.html"
                    ><span aria-hidden="true">←</span> Volver a grupos</a
                >
            </div>

            <section class="card panel-form" aria-labelledby="usuario-form">
                <h2 id="usuario-form">Invitar a una persona</h2>

                <form class="formulario" action="grupos.html" method="post">
                    <fieldset class="grupo-campos">
                        <legend>Destino e invitación</legend>

                        <div class="campo">
                            <label for="usuario-grupo">Grupo</label>
                            <select
                                id="usuario-grupo"
                                name="group_id"
                                required
                                aria-describedby="usuario-grupo-error"
                            >
                                <option value="" selected disabled>
                                    Elige un grupo
                                </option>
                                <option value="1">[Nombre del grupo]</option>
                                <option value="2">[Nombre del grupo]</option>
                                <option value="3">[Nombre del grupo]</option>
                            </select>
                            <p
                                class="campo__error"
                                id="usuario-grupo-error"
                                role="alert"
                            >
                                Selecciona un grupo donde seas anfitrión.
                            </p>
                        </div>

                        <div class="campo">
                            <label for="usuario-correo"
                                >Correo de la persona</label
                            >
                            <input
                                type="email"
                                id="usuario-correo"
                                name="email"
                                required
                                maxlength="255"
                                autocomplete="off"
                                placeholder="persona@ejemplo.com"
                                aria-describedby="usuario-correo-ayuda usuario-correo-error"
                            />
                            <p class="campo__ayuda" id="usuario-correo-ayuda">
                                La persona debe tener una cuenta registrada.
                            </p>
                            <p
                                class="campo__error"
                                id="usuario-correo-error"
                                role="alert"
                            >
                                Introduce un correo electrónico válido.
                            </p>
                        </div>
                    </fieldset>

                    <div class="acciones">
                        <button class="btn btn--primario" type="submit">
                            Añadir al grupo
                        </button>
                        <a class="enlace-accion" href="grupos.html"
                            >Cancelar</a
                        >
                    </div>
                </form>
            </section>
        </main>
    </body>
</html>
