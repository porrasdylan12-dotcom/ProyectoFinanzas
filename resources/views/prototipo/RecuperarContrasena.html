<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Recuperación de contraseña de la aplicación de finanzas personales y gastos compartidos."
        />
        <title>Recuperar contraseña · finanzas</title>
        <link rel="stylesheet" href="../../css/estilos.css" />
        <link rel="stylesheet" href="../../css/formulario.css" />
        <link rel="stylesheet" href="../../css/login.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;600&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header class="barra barra--simple">
            <div class="barra__marca">
                <a class="barra__logo" href="login.html">finanzas</a>
            </div>
        </header>

        <main class="contenido contenido--login">
            <section class="card panel-form" aria-labelledby="recuperar-titulo">
                <h1 id="recuperar-titulo">Recuperar contraseña</h1>
                <p class="login__intro">
                    Escribe el correo con el que te registraste y te enviaremos
                    un enlace seguro para crear una contraseña nueva.
                </p>

                <form class="formulario" action="login.html" method="post">
                    <fieldset class="grupo-campos">
                        <legend>Tu correo</legend>

                        <div class="campo">
                            <label for="correo">Correo electrónico</label>
                            <input
                                type="email"
                                id="correo"
                                name="email"
                                required
                                maxlength="255"
                                autocomplete="email"
                                placeholder="nombre@ejemplo.com"
                                aria-describedby="correo-ayuda correo-error"
                            />
                            <p class="campo__ayuda" id="correo-ayuda">
                                Por seguridad no confirmamos si el correo existe
                                o no.
                            </p>
                            <p
                                class="campo__error"
                                id="correo-error"
                                role="alert"
                            >
                                Introduce un correo electrónico válido.
                            </p>
                        </div>
                    </fieldset>

                    <div class="acciones">
                        <button class="btn btn--primario" type="submit">
                            Enviar enlace
                        </button>
                    </div>
                </form>

                <p class="login__registro">
                    <a class="enlace-accion" href="login.html"
                        >Volver a iniciar sesión</a
                    >
                </p>
            </section>
        </main>
    </body>
</html>
